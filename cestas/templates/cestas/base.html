<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Cestas Solidárias{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-size: 16px; }
    .btn { min-height: 48px; min-width: 48px; font-size: 1.05rem; }
    .form-control { min-height: 48px; font-size: 1rem; }
    :focus-visible { outline: 3px solid #ff8c00; outline-offset: 2px; }
  </style>
</head>
<body class="bg-light">
  <header class="bg-dark text-white py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h5 mb-0">{% block cabecalho %}Cestas Solidárias{% endblock %}</h1>
      {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}" class="m-0">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-light">Sair</button>
      </form>
      {% endif %}
    </div>
  </header>
  <main class="container" style="max-width: 480px;">
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
