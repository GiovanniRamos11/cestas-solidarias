{% extends "cestas/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block cabecalho %}Cestas Solidárias{% endblock %}
{% block conteudo %}
<h2 class="h4 mb-3">Entrar</h2>
{% if form.errors %}
<div class="alert alert-danger" role="alert">
  <strong>✖ Usuário ou senha inválidos.</strong>
</div>
{% endif %}
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label for="id_username" class="form-label">Nome de usuário</label>
    <input type="text" name="username" id="id_username" class="form-control" autocomplete="username" autofocus required>
  </div>
  <div class="mb-3">
    <label for="id_password" class="form-label">Senha</label>
    <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
  </div>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="btn btn-primary w-100">Entrar</button>
</form>
{% endblock %}
